server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:stockpilot_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

stockpilot:
  app:
    name: "StockPilot Test Suite"
    version: "1.0.0-test"
    environment: "test"
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
    max-age-secs: 3600

